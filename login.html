<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · Café Real</title><link rel="stylesheet" href="css/app.css"></head>
<body><div class="login"><div class="l"><h1>Café Real</h1><p>Auditorio, caja y reservas en un solo lugar, cada uno por su lado.</p></div>
<div class="r"><form id="f"><h2>Ingresar</h2><input id="u" placeholder="Usuario" autocomplete="username" required><input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" required><div class="err" id="e" role="alert"></div><button class="p">Ingresar</button></form></div></div>
<script src="js/app.js"></script><script>
if(sessionStorage.cr_user)location.replace('inicio.html');
$('#f').onsubmit=e=>{e.preventDefault();const u=$('#u').value.trim();if(CFG.users[u]&&CFG.users[u]===$('#p').value){sessionStorage.cr_user=u;location.replace('inicio.html')}else $('#e').textContent='Usuario o contraseña incorrectos.'};
</script></body></html>
